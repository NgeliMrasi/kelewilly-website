<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelewilly Construction PTY — Live Invoice</title>
<style>
  :root {
    --navy: #16355C;
    --slate: #525254;
    --cream: #F6F7F1;
    --border: #CBD5E1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #eef2f6;
    color: #0f172a;
    padding: 16px;
  }
  .sheet {
    max-width: 820px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 8px;
    padding: 24px;
    box-shadow: 0 6px 24px rgba(15, 23, 42, 0.08);
  }
  .top-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 16px;
    border-bottom: 3px solid var(--navy);
    padding-bottom: 16px;
    margin-bottom: 20px;
  }
  .brand h1 { color: var(--navy); font-size: 1.4rem; }
  .brand p, .meta p { font-size: 0.9rem; color: var(--slate); }
  .grid-2 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px;
    margin-bottom: 20px;
  }
  .box {
    background: var(--cream);
    padding: 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
  }
  .box label {
    display: block;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--navy);
    margin-bottom: 4px;
  }
  input, textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px;
    font-size: 0.95rem;
    font-family: inherit;
    background: #fff;
    color: #0f172a;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 14px;
    font-size: 0.9rem;
  }
  th {
    background: var(--navy);
    color: #fff;
    text-align: left;
    padding: 8px;
  }
  td {
    border: 1px solid var(--border);
    padding: 6px;
  }
  td input.num { text-align: right; }
  .totals {
    margin-left: auto;
    max-width: 340px;
    background: var(--cream);
    padding: 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
  }
  .total-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    font-size: 0.95rem;
  }
  .total-row.grand {
    font-weight: 800;
    font-size: 1.05rem;
    color: var(--navy);
    border-top: 1px solid var(--border);
    margin-top: 6px;
    padding-top: 8px;
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 18px;
  }
  button {
    background: var(--navy);
    color: #fff;
    border: none;
    padding: 10px 16px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
  }
  button.secondary {
    background: var(--slate);
  }
  @media print {
    body { background: #fff; padding: 0; }
    .sheet { box-shadow: none; padding: 0; }
    .actions, .add-btn { display: none; }
  }
</style>
</head>
<body>
<div class="sheet">
  <div class="top-bar">
    <div class="brand">
      <h1>KELEWILLY CONSTRUCTION PTY</h1>
      <p>Parow &amp; Greater Cape Town, South Africa</p>
      <p>Phone: 072 200 2543 / 074 381 7083 | Email: info@kelewilly-construction.co.za</p>
    </div>
    <div class="meta">
      <label style="font-size:0.75rem;font-weight:700;color:#16355C;">INVOICE #</label>
      <input type="text" id="invNo" value="KW-2026-001">
      <label style="font-size:0.75rem;font-weight:700;color:#16355C;margin-top:6px;display:block;">DATE</label>
      <input type="date" id="invDate" value="2026-11-19">
    </div>
  </div>

  <div class="grid-2">
    <div class="box">
      <label>Client Name &amp; Contact</label>
      <input type="text" placeholder="Client full name & phone/email">
    </div>
    <div class="box">
      <label>Project / Site Address</label>
      <input type="text" placeholder="Street address, suburb (e.g. Parow)">
    </div>
  </div>

  <table id="itemsTable">
    <thead>
      <tr>
        <th style="width:46%">Description of Work / Materials</th>
        <th style="width:14%">Qty</th>
        <th style="width:20%">Rate (R)</th>
        <th style="width:20%">Amount (R)</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td><input type="text" placeholder="e.g. Foundation trenching & concrete footings"></td>
        <td><input type="number" class="num qty" value="1" min="0" step="any" oninput="recalc()"></td>
        <td><input type="number" class="num rate" value="0" min="0" step="any" oninput="recalc()"></td>
        <td><input type="text" class="num line-total" value="0.00" readonly></td>
      </tr>
      <tr>
        <td><input type="text" placeholder="e.g. Structural blockwork & wall raising"></td>
        <td><input type="number" class="num qty" value="1" min="0" step="any" oninput="recalc()"></td>
        <td><input type="number" class="num rate" value="0" min="0" step="any" oninput="recalc()"></td>
        <td><input type="text" class="num line-total" value="0.00" readonly></td>
      </tr>
      <tr>
        <td><input type="text" placeholder="e.g. Exterior plastering & finishing"></td>
        <td><input type="number" class="num qty" value="1" min="0" step="any" oninput="recalc()"></td>
        <td><input type="number" class="num rate" value="0" min="0" step="any" oninput="recalc()"></td>
        <td><input type="text" class="num line-total" value="0.00" readonly></td>
      </tr>
    </tbody>
  </table>
  <button type="button" class="secondary add-btn" onclick="addRow()">+ Add Line Item</button>

  <div class="totals">
    <div class="total-row">
      <span>Subtotal (ZAR):</span>
      <strong id="subtotal">R 0.00</strong>
    </div>
    <div class="total-row">
      <span>Deposit / Paid (ZAR):</span>
      <input type="number" id="paid" class="num" style="width:120px;padding:4px;" value="0" min="0" step="any" oninput="recalc()">
    </div>
    <div class="total-row grand">
      <span>Balance Due (ZAR):</span>
      <span id="balance">R 0.00</span>
    </div>
  </div>

  <div class="grid-2" style="margin-top:20px;">
    <div class="box">
      <label>Banking / Payment Details</label>
      <textarea rows="3" placeholder="Bank name, account holder, account number, branch/reference"></textarea>
    </div>
    <div class="box">
      <label>Notes &amp; Payment Terms</label>
      <textarea rows="3" placeholder="e.g. 50% deposit before commencement, balance on completion"></textarea>
    </div>
  </div>

  <div class="actions">
    <button type="button" onclick="window.print()">Print / Save as PDF</button>
    <button type="button" class="secondary" onclick="location.reload()">Clear Form</button>
  </div>
</div>

<script>
function fmt(n) {
  return 'R ' + Number(n || 0).toLocaleString('en-ZA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function recalc() {
  let sub = 0;
  document.querySelectorAll('#itemsTable tbody tr').forEach(tr => {
    const qty = parseFloat(tr.querySelector('.qty').value) || 0;
    const rate = parseFloat(tr.querySelector('.rate').value) || 0;
    const amt = qty * rate;
    tr.querySelector('.line-total').value = amt.toFixed(2);
    sub += amt;
  });
  const paid = parseFloat(document.getElementById('paid').value) || 0;
  document.getElementById('subtotal').textContent = fmt(sub);
  document.getElementById('balance').textContent = fmt(sub - paid);
}
function addRow() {
  const tbody = document.querySelector('#itemsTable tbody');
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><input type="text" placeholder="Additional work item"></td>
    <td><input type="number" class="num qty" value="1" min="0" step="any" oninput="recalc()"></td>
    <td><input type="number" class="num rate" value="0" min="0" step="any" oninput="recalc()"></td>
    <td><input type="text" class="num line-total" value="0.00" readonly></td>
  `;
  tbody.appendChild(tr);
}
recalc();
</script>
</body>
</html>
